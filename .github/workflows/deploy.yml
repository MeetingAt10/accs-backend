name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }} # main and dev deploy to different stacks, so they must not cancel each other
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  STACK: ${{ github.ref_name == 'main' && 'accs-prod' || 'accs-dev' }} # main is the prod API, dev the dev API

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Sessions live in ccs_identity (TABLE_PREFIX is set on the Lambda), so no signing key is inlined.
      # The deploy user cannot change Lambda configuration and infra deploys only from main, so the write-only Grafana
      # token is compiled into the private Lambda bundle instead of set as environment variables. Unset: no telemetry.
      - name: Build the Lambda bundle
        env:
          GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_HEADERS }}
        run: |
          if [ -n "$GRAFANA_OTLP_ENDPOINT" ] && [ -n "$GRAFANA_OTLP_HEADERS" ]; then
            npm run build:lambda -- \
              "--define:process.env.OTEL_EXPORTER_OTLP_ENDPOINT=$(node -p 'JSON.stringify(process.env.GRAFANA_OTLP_ENDPOINT)')" \
              "--define:process.env.OTEL_EXPORTER_OTLP_HEADERS=$(node -p 'JSON.stringify(process.env.GRAFANA_OTLP_HEADERS)')"
          else
            npm run build:lambda
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the Lambda code
        run: |
          FUNCTION=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='ApiFunctionName'].OutputValue" --output text)
          (cd dist-lambda && zip -qj ../api.zip index.cjs)
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://api.zip --query LastModified --output text
          aws lambda wait function-updated --function-name "$FUNCTION"
