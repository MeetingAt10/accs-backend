name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }} # main and dev deploy to different stacks, so they must not cancel each other
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  STACK: ${{ github.ref_name == 'main' && 'accs-prod' || 'accs-dev' }} # main is the prod API, dev the dev API

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Sessions live in ccs_identity (TABLE_PREFIX is set on the Lambda), so no signing key is inlined.
      - run: npm run build:lambda

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the Lambda code
        run: |
          FUNCTION=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='ApiFunctionName'].OutputValue" --output text)
          (cd dist-lambda && zip -qj ../api.zip index.cjs)
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://api.zip --query LastModified --output text
          aws lambda wait function-updated --function-name "$FUNCTION"
