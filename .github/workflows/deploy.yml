name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  FUNCTION: accs-dev-Api-16DK6Q24YCIV1-Function-rFauAkpucm9r

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A fixed signing key, so session tokens verify on every Lambda instance.
      - run: npm run build:lambda -- --define:process.env.SESSION_SECRET="\"$SESSION_SECRET\""
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update the Lambda code
        run: |
          (cd dist-lambda && zip -qj ../api.zip index.cjs)
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://api.zip --query LastModified --output text
          aws lambda wait function-updated --function-name "$FUNCTION"
